name: Update Night Shift Telemetry

on:
  schedule:
    # Runs at off-peak minutes: 08:17, 16:17, 00:17 HKT (00:17, 08:17, 16:17 UTC)
    - cron: "17 0,8,16 * * *"
  workflow_dispatch:

concurrency:
  group: night-shift-telemetry
  cancel-in-progress: false

jobs:
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Telemetry Generator
        run: |
          python3 scripts/generate_night_shift.py

      - name: Commit and Push Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(telemetry): update night shift handover vignette"
            git push
          fi
