name: Light a Window in Kowloon Compute

on:
  issues:
    types: [opened]

concurrency:
  group: kowloon-light-window
  cancel-in-progress: false

jobs:
  light-window:
    if: startsWith(github.event.issue.title, 'Light a window')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Light Window in README
        run: |
          python3 scripts/light_window.py "${{ github.event.issue.user.login }}"

      - name: Commit and Push Updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No roster changes to commit."
          else
            git commit -m "feat(grid): illuminate window for @${{ github.event.issue.user.login }}"
            git push
          fi

      - name: Acknowledge and Close Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "🏮 **Window Illuminated!** Thank you @${{ github.event.issue.user.login }}, your window is now glowing in **Kowloon Compute**! ✨"
          gh issue close "${{ github.event.issue.number }}" --reason "completed"
